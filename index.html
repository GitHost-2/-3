/* Concepto: una película que se desplaza sola. Negro con letras de tinta clara, noche azul, y un lila con rosa al final. */
:root {
  --ink: #f4ede4;
  --night: #05071a;
  --moon: #f0f2fa;
  --plum: #4b2a7a;
  --rose: #ff4f8f;
  --lilac: #e6d3fa;
  --serif: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --gutter-l: max(20px, env(safe-area-inset-left, 0px));
  --gutter-r: max(20px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: #000; color: var(--ink); font: 16px/1.4 var(--serif); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-font-smoothing: antialiased; }

#app { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; --s: 0; }
#app canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

/* Cada sección ocupa una pantalla y se desplaza con la variable --s (la mueve el guion). */
.slide { position: absolute; inset: 0; pointer-events: none; transform: translateY(calc((var(--i) - var(--s)) * 100%)); will-change: transform; }
.vignette { background: radial-gradient(ellipse at 50% 45%, transparent 58%, rgba(3, 4, 18, 0.5) 100%); }

#blackout { position: absolute; inset: 0; z-index: 4; background: #000; pointer-events: none; }

/* ---------- Frases del inicio ---------- */
#intro { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; padding: 24px var(--gutter-r) 24px var(--gutter-l); text-align: center; pointer-events: none; }
.beat { grid-area: 1 / 1; max-width: 22ch; margin: 0; opacity: 0; font: italic 400 clamp(30px, 6.4vw, 66px)/1.2 var(--serif); letter-spacing: 0.01em; color: var(--ink); text-shadow: 0 0 34px rgba(255, 226, 196, 0.28); text-wrap: balance; will-change: opacity, filter, transform; }
.beat.wide { max-width: 30ch; }
.pair { grid-area: 1 / 1; display: grid; gap: 0.75em; justify-items: center; width: 100%; }
.pair .beat { grid-area: auto; }
.pair .beat:first-child { font-weight: 300; font-size: clamp(26px, 5vw, 54px); }

/* ---------- Sección final ---------- */
#final { display: grid; place-content: center; justify-items: center; gap: 0.7em; padding: 24px var(--gutter-r) 24px var(--gutter-l); text-align: center; }
.fl { max-width: 24ch; margin: 0; opacity: 0; font: italic 500 clamp(26px, 5.2vw, 56px)/1.22 var(--serif); color: var(--plum); text-shadow: 0 1px 24px rgba(255, 255, 255, 0.6); text-wrap: balance; will-change: opacity, filter, transform; }
.fl.soft { font-weight: 400; }
.heart { width: clamp(44px, 8vw, 84px); height: auto; margin-top: 0.4em; opacity: 0; transform-origin: 50% 60%; filter: drop-shadow(0 6px 18px rgba(255, 79, 143, 0.45)); }
.heart.on { animation: beat 1.5s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.16); } 28% { transform: scale(1); } 42% { transform: scale(1.1); } 70% { transform: scale(1); } }

#replay { position: absolute; z-index: 7; left: 50%; bottom: max(22px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: 40px; height: 40px; display: grid; place-items: center; padding: 0; color: var(--plum); background: rgba(255, 255, 255, 0.45); border: 1px solid rgba(75, 42, 122, 0.3); border-radius: 50%; cursor: pointer; opacity: 0; transition: opacity 1.2s ease; }
#replay.on { opacity: 0.85; }
#replay:hover { background: rgba(255, 255, 255, 0.75); }
#replay:focus-visible { outline: 2px solid var(--plum); outline-offset: 3px; }
#replay svg { width: 18px; height: 18px; fill: currentColor; }

/* ---------- Pantalla de carga: negra, para empalmar con las frases ---------- */
#loader { position: absolute; inset: 0; z-index: 9; display: grid; place-content: center; justify-items: center; gap: 16px; background: #000; transition: opacity 0.9s ease, visibility 0.9s; }
#loader.done { opacity: 0; visibility: hidden; }
#loader p { margin: 0; font: italic 300 clamp(20px, 3.6vw, 28px)/1.2 var(--serif); letter-spacing: 0.08em; color: rgba(244, 237, 228, 0.78); }
.track { width: min(46vw, 220px); height: 1px; background: rgba(244, 237, 228, 0.2); overflow: hidden; }
.track i { display: block; width: 100%; height: 100%; background: rgba(244, 237, 228, 0.85); transform: scaleX(0); transform-origin: 0 50%; transition: transform 0.35s ease; }
#loader.failed .track i { background: #ff6f8a; }

@media (prefers-reduced-motion: reduce) { .heart.on { animation: none; } }
</style>
